spring.application.name=habit-coach-agent

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
server.address=0.0.0.0

# Telegram Team Lead
telegram.bot.enabled=true
telegram.bot.polling-delay-ms=1000

# Current project context. The team itself is project-independent.
project.context.current-project-id=habit-coach-agent

# Project registry
project.registry.projects.habit-coach-agent.id=habit-coach-agent
project.registry.projects.habit-coach-agent.name=Habit Coach Agent
project.registry.projects.habit-coach-agent.description=Telegram-based habit coaching platform
project.registry.projects.habit-coach-agent.repository=Anvarjon7/habit-coach-agent
project.registry.projects.habit-coach-agent.default-branch=main
project.registry.projects.habit-coach-agent.technologies[0]=Java
project.registry.projects.habit-coach-agent.technologies[1]=Spring Boot
project.registry.projects.habit-coach-agent.technologies[2]=PostgreSQL
