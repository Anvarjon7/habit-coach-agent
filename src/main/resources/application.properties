spring.application.name=habit-coach-agent

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/habit_coach}
spring.datasource.username=${DB_USERNAME:habit}
spring.datasource.password=${DB_PASSWORD:habit}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8081}
server.address=0.0.0.0
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.task.scheduling.pool.size=4
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
coach.internal-api-key=${COACH_INTERNAL_API_KEY:}

# Configure these only in a secret store or local process environment.
telegram.enabled=${TELEGRAM_ENABLED:false}
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}
