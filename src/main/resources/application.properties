spring.application.name=habit-coach-agent

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
server.address=0.0.0.0

# Telegram Team Lead MVP
telegram.bot.enabled=true
telegram.bot.polling-delay-ms=1000

# Agent Registry
# Frontend is registered globally but intentionally inactive for the backend-only MVP.
agent.registry.projects.habit-coach-agent=zuck,backend,qa,platform,product,research,ilon
