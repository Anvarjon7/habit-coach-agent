# Fast tests are isolated from developer/production PostgreSQL databases.
spring.datasource.url=jdbc:h2:mem:habit_coach_test;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
