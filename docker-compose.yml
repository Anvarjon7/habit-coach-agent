services:
  postgres:
    image: postgres:17
    container_name: habit-coach-postgres
    environment:
      POSTGRES_DB: habit_coach
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: habit
    ports:
      - "5432:5432"
    volumes:
      - habit_coach_data:/var/lib/postgresql/data

volumes:
  habit_coach_data: