name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: habit_coach
          POSTGRES_USER: habit
          POSTGRES_PASSWORD: habit
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U habit -d habit_coach"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/habit_coach
          DB_USERNAME: habit
          DB_PASSWORD: habit
        run: ./mvnw test
