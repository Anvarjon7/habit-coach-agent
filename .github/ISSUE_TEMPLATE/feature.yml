name: Feature
description: Define a focused product or backend feature
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or product problem are we solving?
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: Describe the expected behavior and acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: What should not be changed?
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Testing
      description: What should be tested?
    validations:
      required: true
